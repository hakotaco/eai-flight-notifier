version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  mapsapi:
    build: .
    container_name: mapsapi
    depends_on:
      - rabbitmq
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      - RABBITMQ_EXCHANGE=traffic.notifications
      - POLL_WINDOW_HOURS=${POLL_WINDOW_HOURS:-4}
      - SCHIPHOL_ADDRESS=${SCHIPHOL_ADDRESS:-Amsterdam Airport Schiphol}
      - DASHBOARD_TRAVELERS_QUEUE=${DASHBOARD_TRAVELERS_QUEUE:-dashboard.travelers}
      - SCHIPHOL_ARRIVAL_REQUEST_QUEUE=${SCHIPHOL_ARRIVAL_REQUEST_QUEUE:-schiphol.arrival.request}
      - RPC_TIMEOUT_MS=${RPC_TIMEOUT_MS:-8000}
      - NODE_ENV=production
    # No HTTP port exposure; MQ-only integration
