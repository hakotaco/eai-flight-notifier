version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  mapsapi:
    build: .
    container_name: mapsapi
    depends_on:
      - rabbitmq
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - DASHBOARD_USERS_URL=${DASHBOARD_USERS_URL}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      - RABBITMQ_EXCHANGE=traffic.notifications
      - PORT=3000
      - POLL_CRON=${POLL_CRON:-0 * * * *}
      - POLL_WINDOW_HOURS=${POLL_WINDOW_HOURS:-4}
      - SCHIPHOL_ADDRESS=${SCHIPHOL_ADDRESS:-Amsterdam Airport Schiphol}
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
